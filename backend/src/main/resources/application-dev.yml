spring:
  datasource:
    url: jdbc:h2:mem:personal_web_dev
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

logging:
  level:
    com.changye.web: DEBUG
    org.springframework.web: DEBUG

# Local dev should never write to /srv paths.
repo:
  base-workdir: ${REPO_BASE_WORKDIR:./data/repos}
