spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:personal_web}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

app:
  upload:
    path: ${UPLOAD_PATH:/srv/personal-web/uploads}

storage:
  mode: ${STORAGE_MODE:local_with_oss_backup}
  local:
    base-path: ${UPLOAD_PATH:/srv/personal-web/uploads}
  oss:
    provider: ${OSS_PROVIDER:aliyun}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    region: ${OSS_REGION:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

repo:
  base-workdir: ${REPO_BASE_WORKDIR:/srv/personal-web/repos}
  ssh:
    private-key-path: ${REPO_SSH_PRIVATE_KEY_PATH:/etc/personal-web/keys/id_ed25519}
  command-timeout-seconds: ${REPO_COMMAND_TIMEOUT_SECONDS:120}

logging:
  level:
    com.changye.web: INFO
    org.springframework.web: WARN
