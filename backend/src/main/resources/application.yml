server:
  port: 8080

spring:
  application:
    name: personal-web

  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Upload config
app:
  upload:
    path: ${storage.local.base-path:./uploads/papers}
  metadata:
    semantic-scholar-api-key: ${SEMANTIC_SCHOLAR_API_KEY:}

storage:
  mode: ${STORAGE_MODE:local_only}
  local:
    base-path: ${LOCAL_STORAGE_BASE_PATH:./uploads/papers}
  oss:
    provider: ${OSS_PROVIDER:aliyun}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    region: ${OSS_REGION:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

repo:
  base-workdir: ${REPO_BASE_WORKDIR:/srv/personal-web/repos}
  ssh:
    private-key-path: ${REPO_SSH_PRIVATE_KEY_PATH:/etc/personal-web/keys/id_ed25519}
  command-timeout-seconds: ${REPO_COMMAND_TIMEOUT_SECONDS:120}
