server:
  port: 8080

spring:
  application:
    name: personal-web

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Upload config
app:
  upload:
    path: ./uploads/papers
