services:
  postgres:
    image: postgres:16-alpine
    container_name: personal_web_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_web
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_web"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personal_web_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: personal_web
      DB_USER: postgres
      DB_PASSWORD: postgres
      STORAGE_MODE: local_with_oss_backup
      UPLOAD_PATH: /srv/personal-web/uploads
      REPO_BASE_WORKDIR: /srv/personal-web/repos
      REPO_SSH_PRIVATE_KEY_PATH: /etc/personal-web/keys/id_ed25519
      OSS_PROVIDER: aliyun
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data/uploads:/srv/personal-web/uploads
      - ./data/repos:/srv/personal-web/repos
      - ./data/keys:/etc/personal-web/keys:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: personal_web_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
